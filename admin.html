<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NeonCrates Admin Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root { --admin-panel: #101b2d; --admin-line: rgba(255,255,255,.1); }
    body { min-height: 100vh; background: var(--bg-main); }
    .admin-page { width: 100%; max-width: 1240px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .admin-page-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .admin-page-header h1 { color: var(--neon-cyan); }
    .admin-page-header p { color: var(--text-secondary); margin-top: .35rem; }
    .admin-tabs { display: flex; gap: .75rem; border-bottom: 1px solid var(--admin-line); margin-bottom: 1.5rem; }
    .admin-tab { color: var(--text-secondary); padding: .8rem 1rem; border-bottom: 2px solid transparent; }
    .admin-tab.active { color: var(--neon-green); border-bottom-color: var(--neon-green); }
    .admin-panel { background: var(--admin-panel); border: 1px solid var(--admin-line); border-radius: var(--radius-md); padding: 1.25rem; }
    .admin-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
    .admin-form input { width: 100%; min-width: 0; padding: .75rem; border: 1px solid var(--admin-line); border-radius: var(--radius-sm); color: var(--text-primary); background: var(--bg-card); }
    .admin-form button { min-height: 2.8rem; padding: 0 .9rem; border-radius: var(--radius-sm); color: #07130f; background: var(--neon-green); font-weight: 700; }
    .admin-list { display: grid; gap: .75rem; }
    .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem; border: 1px solid var(--admin-line); border-radius: var(--radius-sm); background: rgba(255,255,255,.025); }
    .admin-row strong { display: block; }
    .admin-row small { color: var(--text-secondary); }
    .admin-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .admin-actions button { padding: .5rem .7rem; border: 1px solid var(--admin-line); border-radius: var(--radius-sm); color: var(--text-primary); background: transparent; }
    .admin-actions .danger { color: var(--neon-coral); }
    .admin-empty, #adminMessage { color: var(--text-secondary); }
    @media (max-width: 768px) {
      .admin-page { padding: 1.25rem 15px 3rem; }
      .admin-page-header, .admin-row { align-items: flex-start; flex-direction: column; }
      .admin-form { grid-template-columns: 1fr; }
      .admin-actions, .admin-actions button { width: 100%; }
    }
  </style>
  <script>
    try {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = 'index.html';
      }
    } catch (error) {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>
  <main class="admin-page">
    <header class="admin-page-header">
      <div>
        <h1>Control Center</h1>
        <p>Manage the NeonCrates catalog and customer orders.</p>
      </div>
      <a class="btn-secondary" href="index.html">Back to store</a>
    </header>

    <nav class="admin-tabs" aria-label="Admin sections">
      <button class="admin-tab active" type="button" data-tab="products">Manage Products</button>
      <button class="admin-tab" type="button" data-tab="orders">View Orders</button>
    </nav>

    <section class="admin-panel" id="productsPanel">
      <h2>Manage Products</h2>
      <form class="admin-form" id="productForm">
        <input id="productId" type="hidden" />
        <input id="productTitle" placeholder="Product title" required />
        <input id="productCategory" placeholder="Category" required />
        <input id="productPrice" type="number" min="0" step="0.01" placeholder="Price" required />
        <input id="productUnit" placeholder="Unit (optional)" />
        <input id="productImage" type="url" placeholder="Image URL (optional)" />
        <button type="submit">Save product</button>
      </form>
      <p id="adminMessage" role="status" aria-live="polite"></p>
      <div class="admin-list" id="productsList"></div>
    </section>

    <section class="admin-panel" id="ordersPanel" hidden>
      <h2>View Orders</h2>
      <div class="admin-list" id="ordersList"></div>
    </section>
  </main>

  <script>
    const API_BASE_URL = 'https://neoncrates-backend.onrender.com';
    const adminHeaders = { 'Content-Type': 'application/json', 'x-user-role': 'admin' };
    const productsList = document.getElementById('productsList');
    const ordersList = document.getElementById('ordersList');
    const productForm = document.getElementById('productForm');
    const adminMessage = document.getElementById('adminMessage');

    async function request(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, { ...options, headers: { ...adminHeaders, ...(options.headers || {}) } });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || 'Request failed');
      return payload;
    }

    function resetProductForm() {
      productForm.reset();
      document.getElementById('productId').value = '';
    }

    function fillProductForm(product) {
      document.getElementById('productId').value = product.id;
      document.getElementById('productTitle').value = product.title || '';
      document.getElementById('productCategory').value = product.category || '';
      document.getElementById('productPrice').value = product.price || '';
      document.getElementById('productUnit').value = product.unit || '';
      document.getElementById('productImage').value = product.image || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadProducts() {
      const products = await request('/api/products');
      productsList.innerHTML = products.length ? products.map(product => `
        <article class="admin-row">
          <div><strong>${product.title}</strong><small>${product.category} | $${Number(product.price).toFixed(2)}</small></div>
          <div class="admin-actions">
            <button type="button" data-edit="${product.id}">Edit</button>
            <button class="danger" type="button" data-delete="${product.id}">Delete</button>
          </div>
        </article>`).join('') : '<p class="admin-empty">No products found.</p>';
    }

    async function loadOrders() {
      const orders = await request('/api/admin/orders');
      ordersList.innerHTML = orders.length ? orders.map(order => `
        <article class="admin-row">
          <div><strong>${order.orderId} | ${order.name}</strong><small>${order.address} | $${Number(order.total).toFixed(2)}</small></div>
          <div class="admin-actions"><button type="button" data-order="${order.orderId}" data-status="Delivered">Mark delivered</button></div>
        </article>`).join('') : '<p class="admin-empty">No orders found.</p>';
    }

    productForm.addEventListener('submit', async event => {
      event.preventDefault();
      const id = document.getElementById('productId').value;
      const body = {
        title: document.getElementById('productTitle').value.trim(),
        category: document.getElementById('productCategory').value.trim(),
        price: document.getElementById('productPrice').value,
        unit: document.getElementById('productUnit').value.trim(),
        image: document.getElementById('productImage').value.trim()
      };
      try {
        await request(id ? `/api/products/${encodeURIComponent(id)}` : '/api/products', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
        adminMessage.textContent = 'Product saved.';
        resetProductForm();
        await loadProducts();
      } catch (error) { adminMessage.textContent = error.message; }
    });

    productsList.addEventListener('click', async event => {
      const editId = event.target.dataset.edit;
      const deleteId = event.target.dataset.delete;
      try {
        if (editId) {
          const products = await request('/api/products');
          const product = products.find(item => item.id === editId);
          if (product) fillProductForm(product);
        }
        if (deleteId) {
          await request(`/api/products/${encodeURIComponent(deleteId)}`, { method: 'DELETE' });
          await loadProducts();
        }
      } catch (error) { adminMessage.textContent = error.message; }
    });

    ordersList.addEventListener('click', async event => {
      const orderId = event.target.dataset.order;
      if (!orderId) return;
      try {
        await request(`/api/admin/orders/${encodeURIComponent(orderId)}/status`, { method: 'PATCH', body: JSON.stringify({ status: event.target.dataset.status }) });
        await loadOrders();
      } catch (error) { ordersList.insertAdjacentHTML('afterbegin', `<p class="admin-empty">${error.message}</p>`); }
    });

    document.querySelectorAll('[data-tab]').forEach(tab => tab.addEventListener('click', async () => {
      document.querySelectorAll('[data-tab]').forEach(item => item.classList.toggle('active', item === tab));
      const showOrders = tab.dataset.tab === 'orders';
      document.getElementById('productsPanel').hidden = showOrders;
      document.getElementById('ordersPanel').hidden = !showOrders;
      if (showOrders) await loadOrders();
    }));

    loadProducts().catch(error => { adminMessage.textContent = error.message; });
  </script>
</body>
</html>
